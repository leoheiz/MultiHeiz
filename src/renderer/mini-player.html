<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;"
  />
  <title>Mini player</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #12151a;
      color: #e8eaed;
      font: 12px/1.3 "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 6px;
      box-sizing: border-box;
      -webkit-app-region: drag;
      background: linear-gradient(180deg, #1c2129 0%, #14181f 100%);
      border-bottom: 1px solid #2a3140;
    }
    .label {
      flex: 0 0 auto;
      opacity: 0.85;
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    .exp {
      flex: 0 0 auto;
      font-size: 10px;
      color: #9aa3b2;
      margin-right: 2px;
    }
    input[type="range"] {
      flex: 1 1 auto;
      min-width: 40px;
      -webkit-app-region: no-drag;
      accent-color: #3d8bfd;
    }
    input.seek {
      flex: 1 1 80px;
      min-width: 48px;
    }
    input.vol {
      flex: 0 0 56px;
      min-width: 40px;
    }
    .pct {
      width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
      font-size: 11px;
    }
    button {
      -webkit-app-region: no-drag;
      border: 0;
      background: transparent;
      color: #e8eaed;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    button:hover { background: rgba(255,255,255,0.08); }
    #hint {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(0,0,0,0.35);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      z-index: 5;
    }
    #hint.show { display: flex; }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button type="button" id="play" title="Reproduzir / pausar" aria-label="Reproduzir / pausar">▶</button>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" title="Posição" aria-label="Posição" />
    <span class="label">Opac.</span>
    <input id="opacity" type="range" min="20" max="100" value="100" step="1" title="Opacidade" aria-label="Opacidade" />
    <span class="pct" id="pct">100%</span>
    <input id="vol" class="vol" type="range" min="0" max="100" value="100" step="1" title="Volume" aria-label="Volume" />
    <button type="button" id="lock" title="Travar com o mouse (Ctrl+Alt+L)" aria-label="Travar">🔒</button>
    <button type="button" id="close" title="Fechar" aria-label="Fechar">×</button>
  </div>
  <div id="hint" aria-live="polite"></div>
  <script>
    (function () {
      var range = document.getElementById('opacity');
      var pct = document.getElementById('pct');
      var seek = document.getElementById('seek');
      var vol = document.getElementById('vol');
      var playBtn = document.getElementById('play');
      var hint = document.getElementById('hint');
      var hintTimer = null;
      var locked = false;
      var seekDragging = false;
      var pollTimer = null;

      function setPctLabel(v) {
        pct.textContent = String(v) + '%';
      }

      function applyOpacity(v) {
        var n = Math.max(20, Math.min(100, Math.round(Number(v) || 100)));
        range.value = String(n);
        setPctLabel(n);
        if (window.mhMini && window.mhMini.setOpacityPercent) {
          window.mhMini.setOpacityPercent(n);
        }
      }

      range.addEventListener('input', function () {
        if (locked) return;
        applyOpacity(range.value);
      });
      document.getElementById('close').addEventListener('click', function () {
        if (window.mhMini && window.mhMini.close) window.mhMini.close();
      });
      document.getElementById('lock').addEventListener('click', function () {
        if (window.mhMini && window.mhMini.toggleLock) window.mhMini.toggleLock();
      });
      playBtn.addEventListener('click', function () {
        if (locked) return;
        if (window.mhMini && window.mhMini.media) {
          window.mhMini.media('toggle').then(function (r) {
            if (r && r.state) updateMediaUi(r.state);
          }).catch(function () {});
        }
      });
      seek.addEventListener('pointerdown', function () { seekDragging = true; });
      seek.addEventListener('pointerup', function () { seekDragging = false; });
      seek.addEventListener('change', function () {
        if (locked) return;
        if (!window.mhMini || !window.mhMini.mediaState) return;
        window.mhMini.mediaState().then(function (st) {
          if (!st || !st.duration) return;
          var t = (Number(seek.value) / 1000) * st.duration;
          return window.mhMini.media('seek', t);
        }).catch(function () {});
      });
      vol.addEventListener('input', function () {
        if (locked) return;
        if (window.mhMini && window.mhMini.media) {
          window.mhMini.media('volume', Number(vol.value) / 100).catch(function () {});
        }
      });

      function updateMediaUi(st) {
        if (!st) return;
        playBtn.textContent = st.paused ? '▶' : '❚❚';
        if (!seekDragging && st.duration > 0) {
          seek.value = String(Math.round((st.currentTime / st.duration) * 1000));
        }
        if (typeof st.volume === 'number') {
          vol.value = String(Math.round((st.muted ? 0 : st.volume) * 100));
        }
      }

      function pollMedia() {
        if (locked || !window.mhMini || !window.mhMini.mediaState) return;
        window.mhMini.mediaState().then(updateMediaUi).catch(function () {});
      }

      function showHint(text) {
        hint.textContent = text;
        hint.classList.add('show');
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function () {
          hint.classList.remove('show');
        }, 1200);
      }

      if (window.mhMini) {
        if (window.mhMini.getInfo) {
          window.mhMini.getInfo().then(function (info) {
            if (!info) return;
            if (typeof info.opacityPercent === 'number') {
              range.value = String(info.opacityPercent);
              setPctLabel(info.opacityPercent);
            }
            locked = !!info.locked;
            document.getElementById('bar').style.visibility = locked ? 'hidden' : 'visible';
          }).catch(function () {});
        }
        if (window.mhMini.onLockHint) {
          window.mhMini.onLockHint(function (payload) {
            locked = !!(payload && payload.locked);
            document.getElementById('bar').style.visibility = locked ? 'hidden' : 'visible';
            showHint(locked ? 'Travado' : 'Destravado');
          });
        }
        if (window.mhMini.onState) {
          window.mhMini.onState(function (payload) {
            if (!payload) return;
            if (typeof payload.opacityPercent === 'number') {
              range.value = String(payload.opacityPercent);
              setPctLabel(payload.opacityPercent);
            }
            if (typeof payload.locked === 'boolean') {
              locked = payload.locked;
              document.getElementById('bar').style.visibility = locked ? 'hidden' : 'visible';
            }
          });
        }
      }
      pollTimer = setInterval(pollMedia, 500);
      pollMedia();
    })();
  </script>
</body>
</html>
