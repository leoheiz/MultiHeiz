<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; object-src 'none'; base-uri 'self'"
/>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MultiHeiz popover</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    color: var(--text, #e8eef4);
    user-select: none;
  }
  #root {
    display: inline-block;
    box-sizing: border-box;
    max-width: 360px;
  }
  #root:empty { display: none; }

  .volume-popover,
  .panel-site-perm-popover,
  .context-menu,
  .panel-ext-menu,
  .layout-menu,
  .mem-popover-box,
  .ai-write-popover,
  .favorites-popover,
  .history-popover {
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid var(--border, #3a4654);
    background: var(--panel-header-bg, var(--bg, #1a222c));
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38);
    color: var(--text, #e8eef4);
  }
  .ai-write-popover {
    width: 300px;
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ai-write-title { font-weight: 600; font-size: 13px; }
  .ai-write-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .ai-write-actions button,
  .ai-write-footer button {
    cursor: pointer;
    border: 1px solid var(--border, #3a4654);
    background: color-mix(in srgb, var(--text) 8%, transparent);
    color: inherit;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
  }
  .ai-write-actions button:hover:not(:disabled),
  .ai-write-footer button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--text) 14%, transparent);
  }
  .ai-write-actions button:disabled,
  .ai-write-footer button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .ai-write-status {
    min-height: 1.2em;
    color: color-mix(in srgb, var(--text) 72%, transparent);
    font-size: 11px;
  }
  .ai-write-status.is-error { color: #e07a7a; }
  .ai-write-result {
    width: 100%;
    min-height: 72px;
    max-height: 140px;
    resize: vertical;
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid var(--border, #3a4654);
    background: color-mix(in srgb, var(--bg, #121820) 80%, #000);
    color: inherit;
    font: inherit;
    padding: 6px 8px;
  }
  .ai-write-footer {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-end;
  }

  .favorites-popover {
    width: 300px;
    /* Fixed px cap (not 70vh): vh of a short WebContentsView collapsed the
       first measure to title+search+actions with an empty-looking tree. */
    max-height: min(420px, var(--mh-popover-max-h, 420px));
    min-height: 160px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .favorites-popover-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .favorites-popover-pin {
    background: transparent;
    border: 1px solid var(--border, #3a4654);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    color: inherit;
  }
  .favorites-popover-pin.is-pinned { border-color: var(--accent, #3d6df0); }
  .favorites-popover-search {
    width: 100%;
    box-sizing: border-box;
    background: color-mix(in srgb, var(--bg, #121820) 80%, #000);
    border: 1px solid var(--border, #3a4654);
    color: inherit;
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
  }
  .favorites-popover-tree {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 280px;
    min-height: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: #4a5568 transparent;
  }
  .favorites-popover-tree::-webkit-scrollbar { width: 8px; }
  .favorites-popover-tree::-webkit-scrollbar-thumb {
    background: #4a5568;
    border-radius: 8px;
  }
  .favorites-folder-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
  }
  .favorites-folder-arrow {
    width: 20px;
    background: transparent;
    border: none;
    color: inherit;
    cursor: pointer;
  }
  .favorites-item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    padding: 6px 8px 6px 22px;
    border-radius: 6px;
  }
  .favorites-item-row:hover {
    background: color-mix(in srgb, var(--text) 12%, transparent);
  }
  .favorites-item-favicon {
    width: 16px;
    height: 16px;
    border-radius: 2px;
  }
  .favorites-popover-actions {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-top: 1px solid var(--border, #3a4654);
    padding-top: 8px;
  }
  .favorites-popover-action {
    text-align: left;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    padding: 6px 4px;
    border-radius: 4px;
  }
  .favorites-popover-action:hover {
    background: color-mix(in srgb, var(--text) 10%, transparent);
  }

  .history-popover {
    width: 340px;
    max-height: min(420px, var(--mh-popover-max-h, 420px));
    min-height: 180px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .history-popover-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .history-popover-head-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .history-popover-icon,
  .history-popover-pin {
    background: transparent;
    border: 1px solid var(--border, #3a4654);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    color: inherit;
  }
  .history-popover-pin.is-pinned { border-color: var(--accent, #3d6df0); }
  .history-popover-search {
    width: 100%;
    box-sizing: border-box;
    background: color-mix(in srgb, var(--bg, #121820) 80%, #000);
    border: 1px solid var(--border, #3a4654);
    color: inherit;
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
  }
  .history-popover-tabs {
    display: flex;
    gap: 4px;
  }
  .history-popover-tab {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border, #3a4654);
    border-radius: 6px;
    color: inherit;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .history-popover-tab.is-active {
    border-color: var(--accent, #3d6df0);
    background: color-mix(in srgb, var(--accent, #3d6df0) 18%, transparent);
  }
  .history-popover-list {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 280px;
    min-height: 80px;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: #4a5568 transparent;
  }
  .history-popover-list::-webkit-scrollbar { width: 8px; }
  .history-popover-list::-webkit-scrollbar-thumb {
    background: #4a5568;
    border-radius: 8px;
  }
  .history-day-header {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.75;
    padding: 6px 4px 2px;
  }
  .history-item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    padding: 6px 4px;
    border-radius: 6px;
  }
  .history-item-row:hover {
    background: color-mix(in srgb, var(--text) 12%, transparent);
  }
  .history-item-favicon {
    width: 16px;
    height: 16px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .history-item-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item-time {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    opacity: 0.75;
    font-size: 11px;
  }
  .history-popover-empty {
    padding: 12px 4px;
    opacity: 0.7;
    font-size: 12px;
  }

  .volume-popover {
    width: 220px;
    padding: 10px 12px 12px;
  }
  .volume-popover-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .volume-popover-title { flex: 1; font-weight: 600; }
  .volume-popover-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 3.2em;
    text-align: right;
  }
  .volume-popover-value.is-boost { color: #e8a54b; }
  .volume-popover-mute {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .volume-popover-mute:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }
  .volume-popover-track {
    position: relative;
    height: 28px;
    display: flex;
    align-items: center;
  }
  .volume-popover-track-bg {
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(
      to right,
      color-mix(in srgb, var(--accent, #2bb8a6) 55%, transparent) 0%,
      color-mix(in srgb, var(--accent, #2bb8a6) 55%, transparent) 50%,
      color-mix(in srgb, #e8a54b 45%, transparent) 50%,
      color-mix(in srgb, #e8a54b 45%, transparent) 100%
    );
    pointer-events: none;
  }
  .volume-popover-track-mark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 14px;
    transform: translate(-50%, -50%);
    background: color-mix(in srgb, var(--text) 35%, transparent);
    pointer-events: none;
  }
  .volume-popover-slider {
    position: relative;
    z-index: 1;
    width: 100%;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 28px;
    cursor: pointer;
  }
  .volume-popover-slider::-webkit-slider-runnable-track {
    height: 6px;
    background: transparent;
  }
  .volume-popover-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text, #e8eef4);
    border: 2px solid var(--panel-header-bg, var(--bg, #1a222c));
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    margin-top: -4px;
  }
  .volume-popover-slider.is-boost::-webkit-slider-thumb { background: #e8a54b; }
  .volume-popover-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted, #8a97a8);
  }
  .volume-popover-labels .boost-label { color: #e8a54b; }
  .volume-popover-boost-note {
    display: none;
    margin-top: 8px;
    font-size: 10px;
    line-height: 1.35;
    color: var(--muted, #8a97a8);
  }
  .volume-popover-boost-note.is-visible { display: block; }

  .panel-site-perm-popover {
    min-width: 260px;
    max-width: 340px;
    padding: 10px 12px;
  }
  .panel-site-perm-origin {
    font-weight: 600;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .panel-site-perm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 4px 0;
  }
  .panel-site-perm-name { flex: 1; }
  .panel-site-perm-select {
    min-width: 110px;
    background: var(--bg, #1a222c);
    color: var(--text, #e8eef4);
    border: 1px solid var(--border, #3a4654);
    border-radius: 4px;
    padding: 2px 4px;
  }
  .panel-site-perm-reset {
    margin-top: 8px;
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border, #3a4654);
    background: transparent;
    color: inherit;
    cursor: pointer;
  }

  .context-menu, .layout-menu {
    min-width: 140px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .context-menu button,
  .layout-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  .context-menu button:hover,
  .layout-menu button:hover,
  .layout-menu button.is-active {
    background: color-mix(in srgb, var(--accent, #2bb8a6) 22%, transparent);
  }

  .panel-ext-menu {
    min-width: 260px;
    max-width: 320px;
    padding: 8px;
  }
  .panel-ext-badge {
    font-size: 10px;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .panel-ext-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .panel-ext-row img { width: 18px; height: 18px; }
  .panel-ext-name {
    flex: 1;
    text-align: left;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  .panel-ext-name:disabled { opacity: 0.5; cursor: default; }
  .panel-ext-manage {
    margin-top: 6px;
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border, #3a4654);
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .empty { opacity: 0.7; padding: 6px 0; }

  /* Shared popover shell: fixed head + internal dark scroll (no outer white bar). */
  .mh-popover-shell {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .mh-popover-head {
    flex-shrink: 0;
  }
  .mh-popover-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #4a5568 transparent;
  }
  .mh-popover-scroll::-webkit-scrollbar {
    width: 8px;
  }
  .mh-popover-scroll::-webkit-scrollbar-track {
    background: transparent;
    margin: 4px 0;
  }
  .mh-popover-scroll::-webkit-scrollbar-thumb {
    background: #4a5568;
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .mh-popover-scroll::-webkit-scrollbar-thumb:hover {
    background: #5c6b80;
    background-clip: padding-box;
  }

  .mem-popover-box {
    min-width: 300px;
    max-width: 380px;
    /* Cap height to available space (main sets --mh-popover-max-h). */
    max-height: var(--mh-popover-max-h, 520px);
    min-height: 120px;
    overflow: hidden;
    padding: 10px 12px;
  }
  .mem-popover-body {
    padding-right: 2px;
  }
  .mem-popover-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    margin-bottom: 6px;
    gap: 8px;
  }
  .mem-popover-close {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .mem-popover-close:hover {
    background: color-mix(in srgb, var(--text) 12%, transparent);
  }
  .mem-popover-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .mem-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px;
    border: 1px solid var(--border, #3a4654);
    border-radius: 6px;
    background: color-mix(in srgb, var(--bg, #121820) 55%, transparent);
  }
  .mem-stat-k {
    font-size: 10px;
    color: var(--muted, #8a97a8);
  }
  .mem-stat-v {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .mem-popover-total {
    color: var(--muted, #8a97a8);
    font-size: 11px;
    margin-bottom: 8px;
    white-space: pre-line;
  }
  .mem-popover-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .mem-action-btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid var(--border, #3a4654);
    background: color-mix(in srgb, var(--text) 8%, transparent);
    color: inherit;
    cursor: pointer;
  }
  .mem-action-btn:hover:not(:disabled) {
    background: color-mix(in srgb, var(--text) 14%, transparent);
  }
  .mem-action-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .mem-popover-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
    /* ~5 rows; own scroll so the opts below stay reachable. */
    max-height: calc(5 * 52px);
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #4a5568 transparent;
  }
  .mem-popover-list::-webkit-scrollbar {
    width: 8px;
  }
  .mem-popover-list::-webkit-scrollbar-thumb {
    background: #4a5568;
    border-radius: 8px;
  }
  .mem-popover-opts {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border, #3a4654);
    font-size: 11px;
  }
  .mem-opt-check {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .mem-opt-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mem-opt-row input[type="number"],
  .mem-opt-row select {
    width: 72px;
    padding: 2px 4px;
    border-radius: 4px;
    border: 1px solid var(--border, #3a4654);
    background: color-mix(in srgb, var(--bg, #121820) 70%, transparent);
    color: inherit;
    font: inherit;
  }
  .mem-opt-note {
    margin: 0;
    color: var(--muted, #8a97a8);
    font-size: 10px;
    line-height: 1.35;
  }
  .mem-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 8px;
    padding: 8px;
    border: 1px solid var(--border, #3a4654);
    border-radius: 6px;
    background: color-mix(in srgb, var(--bg, #121820) 70%, transparent);
    font-size: 11px;
    cursor: pointer;
  }
  .mem-row:hover {
    background: color-mix(in srgb, var(--text) 8%, transparent);
  }
  .mem-row-title { font-weight: 600; }
  .mem-row-meta {
    color: var(--muted, #8a97a8);
    font-size: 11px;
    grid-column: 1;
  }
  .mem-row-actions {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    align-items: center;
  }
  .mem-row-actions button {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid var(--border, #3a4654);
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .mem-row-actions button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--text) 12%, transparent);
  }
  .mem-row-actions button:disabled {
    opacity: 0.45;
    cursor: default;
  }
</style>
</head>
<body>
<div id="root" role="presentation"></div>
<script src="popover-overlay-app.js"></script>
</body>
</html>
