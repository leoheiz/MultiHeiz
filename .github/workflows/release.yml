name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Fix Electron chrome-sandbox permissions
        run: |
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox || true
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox || true
          fi
      - run: npm run check:encoding
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow unprivileged user namespaces for Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Static/unit security checks (+ electron selftest via xvfb)
        run: xvfb-run -a npm run check:security-review

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
